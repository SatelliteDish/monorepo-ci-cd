name: deploy
run-name: Deploying monorepo
on:
  push:
    branches:
      - 'main'
jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v1
        with:
          cache: true
      - name: Install project dependencies
        run: pnpm i
      - name: Get changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: ./scripts/ci/changed.sh "$BEFORE" "$AFTER" > /dev/null
      - name: Deploy changed packages
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          while read -r pkg; do
            name="$(jq -r '.name' <<<"$pkg")"
            path="$(jq -r '.path' <<<"$pkg")"

            echo "Deploying ${name}..."
            if ! pnpm -C "$path" run deploy 1>/dev/null; then
              echo "Failed to deploy $name"
              exit 1
            fi
          done < <(jq -c '.[]' <<<"$CHANGED")
