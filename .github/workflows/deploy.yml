name: deploy
run-name: Deploying monorepo
on:
  push:
    branches:
      - 'main'
      - 'dev'
jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v1
        with:
          cache: true
      - name: Install project dependencies
        run: pnpm i
      - name: Get changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          json="$(./scripts/ci/changed.sh $BEFORE $AFTER)"

          # Loop over workspace members
          while read member; do
            name="$(echo "$member" | jq -r '.name')"
            path="$(echo "$member" | jq -r '.path')"
            changed="$(echo "$member" | jq -r '.changed')"

            echo "$name is $changed"
            if [[ "$changed" = "true" ]]; then
              echo "BUILDING AT $path"
              pnpm -C "$path" run deploy 1>/dev/null
              rc=$?

              if [ "$rc" -ne "0" ]; then
                echo "Failed to deploy $name"
                echo "RC: $rc"
                exit 1
              fi
            fi

          done < <(echo "$json" | jq -c '.[]')

