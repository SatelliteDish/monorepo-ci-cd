name: deploy
run-name: Deploying monorepo
on:
  push:
    branches:
      - 'main'
      - 'dev'
jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Install runner dependencies
        run: |
          npx get-pnpm
          source /home/runner/.bashrc
      - name: Install project dependencies
        run: pnpm i
      - name: Get changes
        run: |
            JSON="$(./scripts/ci/changed.sh)"
            echo "$JSON"

